# The three platform-started PE drivers are stored in FREEFORM FFS files so
# DXE cannot auto-dispatch them. Validate them with the same DEFAULT AARCH64
# requirements as DXE_DRIVER: 4 KiB alignment and no writable executable section.
# Do not ignore these images or weaken the existing validation profiles.
IMAGE_FILE_MACHINE_ARM64:
    FREEFORM: {}
